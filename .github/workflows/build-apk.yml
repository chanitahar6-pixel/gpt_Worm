name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          JAVA_MAJOR=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java major version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version must be 17 or newer. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment successfully verified (Version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing file."
          else
            echo "debug.keystore not found. Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Debug keystore confirmed present."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Searching only inside app/build/outputs/apk for available APK files:"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK at $APK_PATH is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified APK successfully: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$TEMP_DIR"
          TARGET_APK="${TEMP_DIR}/app-debug.apk"
          cp "$SRC_APK" "$TARGET_APK"
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Failed to copy APK to temporary release directory."
            exit 1
          fi
          echo "Prepared release asset: $TARGET_APK"
          echo "asset_path=$TARGET_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK does not exist at $RELEASE_ASSET"
            exit 1
          fi
          if [ ! -s "$RELEASE_ASSET" ]; then
            echo "ERROR: Prepared APK is empty."
            exit 1
          fi
          case "$RELEASE_ASSET" in
            *.apk) ;;
            *) echo "ERROR: Prepared asset is not an APK file."; exit 1 ;;
          esac
          FILENAME=$(basename "$RELEASE_ASSET")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Asset filename must be exactly app-debug.apk, found $FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - Notice: This APK is intended for testing and is not a Play Store production release.
          - Keystore: Signed only with a temporary debug keystore.
          EOF
          )

          echo "Creating release: tag=$RELEASE_TAG, title=$RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "=========================================="
            echo "GitHub Release successfully created!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            echo "Actions Artifact 'app-debug-apk' remains available as backup."
            echo "=========================================="

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions backup artifact \`app-debug-apk\` is also preserved in this workflow run." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=========================================="
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully."
              echo "The GitHub Actions backup artifact 'app-debug-apk' remains available for download in this run."
            fi
            echo "Direct latest release download is NOT available for this run."
            echo "=========================================="

            echo "## Release Notice" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publishing failed or was skipped. Please check workflow run logs." >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK artifact (\`app-debug-apk\`) remains available in the run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
